name: diamond
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.2
  - pandas=2.3
  - scipy=1.15
  - matplotlib=3.10
  - scikit-learn=1.7
  - pip
  - pip:
      # pose estimation. Only needed to extract joints from video, which is
      # Section VIII; every table and figure of Sections V to VII is produced from
      # the OpenBiomechanics marker trajectories and needs none of it.
      - opencv-python==4.13.0.*
      - onnxruntime==1.23.2
      - rtmlib
